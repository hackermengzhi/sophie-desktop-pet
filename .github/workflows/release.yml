name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: SophieDesktopPet/packages.lock.json

      - name: Validate tag and project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must match vX.Y.Z"
            exit 1
          }
          expected="${RELEASE_TAG#v}"
          actual="$(
            dotnet msbuild SophieDesktopPet/SophieDesktopPet.csproj \
              -nologo -v:q -getProperty:Version |
              tr -d '\r' | tail -n 1
          )"
          test "$actual" = "$expected" || {
            echo "::error::Tag $expected does not match project $actual"
            exit 1
          }
          test "$(uname -m)" = "arm64"

      - name: Restore locked dependencies
        run: >-
          dotnet restore SophieDesktopPet/SophieDesktopPet.csproj
          --runtime osx-arm64
          --locked-mode

      - name: Package and verify app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chmod +x scripts/package-macos-arm64.sh
          scripts/package-macos-arm64.sh \
            SophieDesktopPet/SophieDesktopPet.csproj \
            "${RELEASE_TAG#v}" \
            dist

      - name: Retain verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Sophie-Desktop-Pet-macOS-arm64
          path: |
            dist/Sophie-Desktop-Pet-macOS-arm64.zip
            dist/Sophie-Desktop-Pet-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Sophie-Desktop-Pet-macOS-arm64
          path: dist

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f dist/Sophie-Desktop-Pet-macOS-arm64.zip
          test -f dist/Sophie-Desktop-Pet-macOS-arm64.zip.sha256
          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi
          cleanup_draft() {
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Sophie Desktop Pet $RELEASE_TAG" \
            --generate-notes \
            dist/Sophie-Desktop-Pet-macOS-arm64.zip \
            dist/Sophie-Desktop-Pet-macOS-arm64.zip.sha256
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          trap - ERR
