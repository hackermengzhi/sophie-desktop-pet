name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json

      - name: Restore
        run: >-
          dotnet restore SophieDesktopPet/SophieDesktopPet.csproj
          --runtime osx-arm64
          --locked-mode

      - name: Build
        run: dotnet build SophieDesktopPet/SophieDesktopPet.csproj -c Release --no-restore

      - name: Package macOS app
        run: |
          set -euo pipefail
          version="$(
            dotnet msbuild SophieDesktopPet/SophieDesktopPet.csproj \
              -nologo -v:q -getProperty:Version |
              tr -d '\r' | tail -n 1
          )"
          chmod +x scripts/package-macos-arm64.sh
          scripts/package-macos-arm64.sh \
            SophieDesktopPet/SophieDesktopPet.csproj \
            "$version" \
            dist

      - name: Upload packaged app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Sophie-Desktop-Pet-package-macOS-arm64
          path: |
            dist/Sophie-Desktop-Pet-macOS-arm64.zip
            dist/Sophie-Desktop-Pet-macOS-arm64.zip.sha256
          if-no-files-found: error
